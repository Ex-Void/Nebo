<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель администратора · Небо</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // день или ночь — по часам пользователя (до отрисовки, чтобы фон не мигал)
    (function () { var h = new Date().getHours(); document.documentElement.classList.add(h >= 7 && h < 19 ? "is-day" : "is-night"); })();
  </script>
</head>
<body data-sky="admin" class="is-admin">
  <!-- анимированное небо -->
  <div class="sky" aria-hidden="true">
    <div class="sky-layer sky-clear"></div>
    <div class="sky-layer sky-partly"></div>
    <div class="sky-layer sky-cloudy"></div>
    <div class="sky-layer sky-fog"></div>
    <div class="sky-layer sky-rain"></div>
    <div class="sky-layer sky-snow"></div>
    <div class="sky-layer sky-storm"></div>
    <div class="sky-layer sky-admin"></div>
    <div class="sky-glow"></div>
    <canvas id="sky-canvas"></canvas>
    <div class="flash-overlay"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" id="brand-icon"></span>
      <span class="brand-name">Небо</span>
    </a>
    <nav class="tabs" id="tabs">
      <a href="/" class="tab">Сейчас</a>
      <a href="/forecast" class="tab">Прогноз</a>
      <a href="/feedback" class="tab">Обратная связь</a>
      <a href="/admin" class="tab tab-admin active">Админ</a>
      <span class="tab-indicator" aria-hidden="true"></span>
    </nav>
  </header>

  <div class="toasts" id="toasts"></div>

  <main class="page">
    <!-- форма входа -->
    <section class="login glass hidden" id="login">
      <div class="login-icon" id="login-icon"></div>
      <h1>Панель администратора</h1>
      <p class="muted">Войдите, чтобы управлять базой данных сайта</p>
      <form class="form" id="login-form">
        <div class="field">
          <input id="l-user" name="username" placeholder=" " autocomplete="username" required>
          <label for="l-user">Логин</label>
        </div>
        <div class="field">
          <input id="l-pass" name="password" type="password" placeholder=" " autocomplete="current-password" required>
          <label for="l-pass">Пароль</label>
        </div>
        <p class="alert alert-error hidden" id="login-error"></p>
        <button class="btn btn-primary w100" type="submit">Войти</button>
      </form>
    </section>

    <!-- панель -->
    <div class="admin hidden" id="panel">
      <aside class="sidebar glass">
        <div class="who">
          <span class="avatar" id="avatar"></span>
          <div><b id="who-name"></b><span class="muted small" id="who-role"></span></div>
        </div>
        <nav class="side-nav" id="side-nav">
          <a href="#cities" data-section="cities"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg>Города</a>
          <a href="#weather" data-section="weather"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3z" fill="currentColor"/></svg>Текущая погода</a>
          <a href="#feedback" data-section="feedback"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z" fill="currentColor"/></svg>Сообщения<span class="badge hidden" id="side-badge"></span></a>
          <a href="#database" data-section="database"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2C7 2 3 3.8 3 6v12c0 2.2 4 4 9 4s9-1.8 9-4V6c0-2.2-4-4-9-4zm0 2c4.4 0 7 1.4 7 2s-2.6 2-7 2-7-1.4-7-2 2.6-2 7-2z" fill="currentColor"/></svg>База данных</a>
          <a href="#users" data-section="users"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-9 2-9 5v3h18v-3c0-3-5-5-9-5z" fill="currentColor"/></svg>Администраторы</a>
          <a href="#log" data-section="log"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4h16v2H4zm0 5h16v2H4zm0 5h10v2H4zm0 5h10v2H4z" fill="currentColor"/></svg>Журнал</a>
        </nav>
        <button class="btn btn-ghost w100" type="button" id="logout">Выйти</button>
      </aside>
      <section class="admin-main" id="admin-main"></section>
    </div>
  </main>

  <footer class="footer">
    <span>«Небо» — сайт прогноза погоды</span>
    <span id="footer-date"></span>
  </footer>

  <script src="/js/icons.js"></script>
  <script src="/js/sky.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
